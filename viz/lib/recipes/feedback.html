<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOC_NAME_PLACEHOLDER</title>
<style>
/* musingfox standalone token contract. */
:root {
    --bg: #07080a;
    --surface: #181818;
    --surface-warm: #222222;

    --fg: #e8e8e5;
    --fg-2: #c4c5b5;
    --muted: #75715e;
    --meta: #49483e;

    --border: #2e2e2e;
    --border-soft: #1f1f1f;

    --accent: #fd971f;
    --accent-on: #07080a;
    --accent-hover: #ffb85a;
    --accent-active: #c97608;

    --success: #98e024;
    --warn: #e0d561;
    --danger: #f4005f;

    --font-display: "Fira Code", "jf Open Huninn", "PingFang TC", "Microsoft JhengHei", ui-monospace, monospace;
    --font-body: "Fira Code", "jf Open Huninn", "PingFang TC", "Microsoft JhengHei", ui-monospace, monospace;
    --font-mono: "Fira Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --text-xs: 11px;
    --text-sm: 13px;
    --text-base: 16px;
    --text-lg: 20px;
    --text-xl: 28px;

    --leading-body: 1.55;
    --leading-tight: 1.15;
    --tracking-display: -0.02em;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-12: 48px;

    --radius-sm: 4px;
    --radius-md: 4px;
    --radius-lg: 10px;
    --radius-pill: 9999px;

    --elev-raised: 0 4px 16px rgb(0 0 0 / 50%);
    --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--accent);

    --motion-fast: 120ms;
    --motion-base: 200ms;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);

    --container-gutter-desktop: 24px;
    --container-gutter-phone: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; background: var(--bg); }
body {
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.7;
    color: var(--fg);
    background:
        radial-gradient(circle at 82% 4%, color-mix(in srgb, var(--accent), transparent 88%), transparent 34rem),
        linear-gradient(var(--border-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-soft) 1px, transparent 1px),
        var(--bg);
    background-size: auto, 32px 32px, 32px 32px, auto;
    background-attachment: fixed;
    font-variant-ligatures: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
button, input, textarea { font: inherit; }
button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible,
textarea:focus-visible, .opt:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
}

/* -- Top bar -- */
.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border); padding: var(--space-3) var(--space-6);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3);
}
.topbar h1 { font-family: var(--font-display); font-size: var(--text-base); font-weight: 700; flex: 1 0 auto; min-width: 180px; }
.topbar .pill {
    font-size: var(--text-xs); color: var(--accent);
    border: 1px solid var(--accent);
    padding: 1px var(--space-2); border-radius: var(--radius-pill);
}
.actions { display: flex; gap: var(--space-2); }
.actions button {
    min-height: 32px; padding: var(--space-1) var(--space-4);
    border-radius: var(--radius-sm); border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-on); font-size: var(--text-sm);
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.actions button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.actions button:active { opacity: .85; }
.actions button.ghost { background: var(--surface); color: var(--fg); border-color: var(--border); }
.actions button.ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--surface); }

/* -- Document body -- */
main { max-width: 880px; margin: var(--space-6) auto var(--space-12); padding: 0 var(--container-gutter-desktop); }
.brief {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-8);
}
.brief h1, .brief h2, .brief h3 {
    font-family: var(--font-display);
    margin-top: var(--space-8); margin-bottom: var(--space-3); font-weight: 700;
    line-height: var(--leading-tight);
}
.brief > :first-child { margin-top: 0; }
.brief h1 { font-size: var(--text-xl); letter-spacing: var(--tracking-display); border-bottom: 1px solid var(--border); padding-bottom: var(--space-3); }
.brief h2 { font-size: var(--text-lg); border-bottom: 1px solid var(--border-soft); padding-bottom: var(--space-2); }
.brief h3 { font-size: var(--text-base); }
.brief p { margin: var(--space-3) 0; }
.brief a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--motion-fast) var(--ease-standard); }
.brief a:hover { border-bottom-color: var(--accent); }
.brief ul, .brief ol { padding-left: var(--space-6); margin: var(--space-2) 0; }
.brief li { margin: var(--space-1) 0; }
.brief li::marker { color: var(--muted); }
.brief code {
    background: var(--surface-warm); padding: 1px var(--space-1);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg-2);
}
.brief pre {
    background: var(--surface-warm); color: var(--fg-2); padding: var(--space-4);
    border: 1px solid var(--border); border-radius: 0;
    overflow-x: auto; margin: var(--space-5) 0;
}
.brief pre code { background: none; border: none; padding: 0; color: inherit; font-size: var(--text-sm); }
.brief blockquote {
    border-left: 2px solid var(--accent); margin: var(--space-5) 0; padding: var(--space-3) var(--space-5);
    background: var(--surface-warm); color: var(--fg-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.table-wrap { overflow-x: auto; margin: var(--space-5) 0; border-radius: var(--radius-md); border: 1px solid var(--border); }
.brief table { border-collapse: collapse; width: 100%; }
.brief th, .brief td { padding: var(--space-2) var(--space-3); text-align: left; font-size: var(--text-sm); }
.brief th { font-weight: 700; color: var(--fg-2); background: var(--surface-warm); border-bottom: 1px solid var(--border); white-space: nowrap; }
.brief td { border-bottom: 1px solid var(--border-soft); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.brief tr:last-child td { border-bottom: none; }
.brief hr { border: none; border-top: 1px solid var(--border); margin: var(--space-8) 0; }
.mermaid-shell {
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4);
    background: var(--surface-warm); margin: var(--space-5) 0; text-align: center; overflow-x: auto;
    transition: border-color var(--motion-fast) var(--ease-standard);
}
.mermaid-shell:hover { border-color: var(--accent); }

/* -- View toggle (圖卡 / 原文) -- */
.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-pill); overflow: hidden; }
.view-toggle button {
    font: inherit; font-size: var(--text-xs); background: none; color: var(--fg-2); border: 0;
    padding: var(--space-1) var(--space-4); cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.view-toggle button.on { background: var(--accent); color: var(--accent-on); font-weight: 700; }

/* -- Card view: a projection of the body; 原文 is the verbatim render -- */
main.wide { max-width: 1080px; }
.prose p { margin: var(--space-3) 0; color: var(--fg-2); }
.prose ul, .prose ol { padding-left: var(--space-6); margin: var(--space-2) 0; color: var(--fg-2); }
.prose li { margin: var(--space-1) 0; }
.prose li::marker { color: var(--muted); }
.prose a { color: var(--accent); text-decoration: none; }
.prose h3, .prose h4 { font-family: var(--font-display); font-size: var(--text-base); margin: var(--space-5) 0 var(--space-2); }
.prose table { border-collapse: collapse; width: 100%; }
.prose th, .prose td { padding: var(--space-2) var(--space-3); text-align: left; font-size: var(--text-sm); border-bottom: 1px solid var(--border-soft); }
.prose th { background: var(--surface-warm); }
.prose pre { background: var(--surface-warm); padding: var(--space-4); border: 1px solid var(--border); overflow-x: auto; }
.prose hr { border: none; border-top: 1px solid var(--border); margin: var(--space-6) 0; }
.prose blockquote { border-left: 2px solid var(--accent); margin: var(--space-4) 0; padding: var(--space-2) var(--space-4); background: var(--surface-warm); }
.prose code, .cv-card code, .cv-tile code, .cv-verdict code {
    background: var(--surface-warm); padding: 1px var(--space-1);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: .92em; color: var(--fg-2);
}
.cv-hero h1 { font-family: var(--font-display); font-size: var(--text-xl); letter-spacing: var(--tracking-display); margin: var(--space-2) 0; }
.cv-hero p { font-size: var(--text-base); }
.cv-kicker {
    font-family: var(--font-display); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin: var(--space-8) 0 var(--space-3); font-weight: 700;
}
.cv-tiles, .cv-cards { display: grid; gap: var(--space-3); }
.cv-tiles { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.cv-cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: var(--space-4); }
.cv-tile {
    display: flex; flex-direction: column; gap: var(--space-1);
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--muted);
    border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); font-size: var(--text-sm);
}
.cv-tile b { margin-bottom: var(--space-1); }
.cv-tile .kv { color: var(--fg-2); font-size: var(--text-xs); line-height: 1.6; }
.cv-tile .kv span { color: var(--muted); margin-right: var(--space-2); }
.cv-decision {
    margin-top: var(--space-8); padding: var(--space-5);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
}
.cv-q { display: flex; align-items: baseline; gap: var(--space-3); }
.cv-q .num { color: var(--accent); font-weight: 700; font-size: var(--text-sm); }
.cv-q h2 { font-family: var(--font-display); font-size: var(--text-lg); margin: 0; flex: 1; }
.cv-q .multi-tag {
    font-size: var(--text-xs); color: var(--warn); border: 1px solid var(--warn);
    padding: 1px var(--space-2); border-radius: var(--radius-pill);
}
.cv-card {
    position: relative; display: flex; flex-direction: column; gap: var(--space-2);
    text-align: left; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-4);
    cursor: pointer;
    transition: border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.cv-card:hover { border-color: var(--muted); transform: translateY(-1px); }
.cv-card.rec { border-color: var(--accent); }
.cv-card.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface-warm); }
.cv-card .name { font-weight: 700; font-size: var(--text-sm); padding-right: 44px; }
.cv-card .rec-tag {
    position: absolute; top: var(--space-3); right: var(--space-3);
    font-size: var(--text-xs); color: var(--success); border: 1px solid var(--success);
    padding: 0 var(--space-2); border-radius: var(--radius-pill);
}
.cv-card ul { margin: 0; padding: 0; list-style: none; font-size: var(--text-xs); color: var(--fg-2); line-height: 1.6; }
.cv-card li { position: relative; padding-left: var(--space-4); margin: 2px 0; }
.cv-card li.pro::before { content: "+"; position: absolute; left: 0; color: var(--success); font-weight: 700; }
.cv-card li.con::before { content: "−"; position: absolute; left: 0; color: var(--danger); font-weight: 700; }
.cv-card .extra { font-size: var(--text-xs); color: var(--fg-2); }
.cv-card .extra span { color: var(--muted); margin-right: var(--space-1); }
.cv-meter { margin-top: auto; font-size: var(--text-xs); color: var(--muted); }
.cv-meter .bar { display: flex; gap: 3px; margin: var(--space-1) 0; }
.cv-meter .bar i { flex: 1; height: 6px; border-radius: 2px; background: var(--border); }
.cv-meter[data-level="1"] .bar i.on, .cv-meter[data-level="2"] .bar i.on { background: var(--success); }
.cv-meter[data-level="3"] .bar i.on { background: var(--warn); }
.cv-meter[data-level="4"] .bar i.on { background: var(--accent); }
.cv-meter[data-level="5"] .bar i.on { background: var(--danger); }
.cv-meter .why { color: var(--fg-2); }
.cv-pick { font-size: var(--text-xs); color: var(--muted); }
.cv-card.selected .cv-pick { color: var(--accent); }
.cv-more {
    align-self: flex-start; font: inherit; font-size: var(--text-xs); color: var(--accent);
    background: none; border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 1px var(--space-3); cursor: pointer;
}
.cv-more:hover { border-color: var(--accent); }
.cv-tile.has-more { cursor: pointer; }
.cv-tile.has-more:hover { border-left-color: var(--accent); }
.cv-tile .cv-more { margin-top: var(--space-2); }
.cv-open { border-color: var(--accent) !important; }
.cv-drawer {
    margin-top: var(--space-3); padding: var(--space-3) var(--space-5);
    background: var(--surface-warm); border: 1px solid var(--accent); border-radius: var(--radius-sm);
    font-size: var(--text-sm); animation: cv-drop var(--motion-base) var(--ease-standard);
}
.cv-drawer .head { display: flex; justify-content: space-between; gap: var(--space-3); font-weight: 700; }
.cv-drawer .head button { font: inherit; font-size: var(--text-xs); background: none; border: 0; color: var(--muted); cursor: pointer; }
@keyframes cv-drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.cv-verdict {
    margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
    border-left: 3px solid var(--accent); background: var(--surface-warm); border-radius: var(--radius-sm);
    font-size: var(--text-sm); color: var(--fg-2);
}
.cv-verdict::before { content: "★ "; color: var(--accent); }
.cv-verdict p { display: inline; margin: 0; }
.cv-decision .notes-label { margin-top: var(--space-4); }
.cv-decision textarea {
    width: 100%; min-height: 56px; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-3);
    font-size: var(--text-sm); line-height: 1.6; color: var(--fg);
    background: var(--bg); caret-color: var(--accent); outline: none;
}
.cv-decision textarea:focus { border-color: var(--accent); }

/* -- Feedback panel -- */
.decision {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    margin-top: var(--space-6); padding: var(--space-6);
    border-top: 2px solid var(--accent);
}
.decision h2 {
    font-family: var(--font-display);
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--accent); font-weight: 700; margin-bottom: var(--space-1);
}
.decision .sub { font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-4); }
.question + .question { border-top: 1px solid var(--border-soft); padding-top: var(--space-4); margin-top: var(--space-4); }
.q-title {
    display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--text-base); font-weight: 700; margin-bottom: var(--space-3);
}
.q-title .multi-tag {
    font-size: var(--text-xs); color: var(--warn);
    border: 1px solid var(--warn);
    padding: 1px var(--space-2); border-radius: var(--radius-pill); letter-spacing: 0.04em;
}
.opts { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-5); }
.opt {
    display: flex; align-items: center; gap: var(--space-3);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4);
    background: var(--surface-warm);
    cursor: pointer; user-select: none;
    transition: border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.opt:hover { border-color: var(--accent); }
.opt.selected { border-color: var(--accent); color: var(--accent); }
.opt .dot {
    width: 16px; height: 16px; border-radius: var(--radius-pill); border: 1px solid var(--muted);
    flex-shrink: 0; position: relative;
    transition: border-color var(--motion-fast) var(--ease-standard);
}
.opt.selected .dot { border-color: var(--accent); }
.opt.selected .dot::after {
    content: ''; position: absolute; inset: 3px;
    background: var(--accent); border-radius: var(--radius-pill);
}
.opt .dot.multi { border-radius: 2px; }
.opt.selected .dot.multi::after { border-radius: 1px; }
.opt .label { flex: 1; font-size: var(--text-sm); }
.opt .rec {
    font-size: var(--text-xs); color: var(--success);
    border: 1px solid var(--success);
    padding: 1px var(--space-2); border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.04em;
}
.notes-label { font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-2); display: block; }
.decision textarea {
    width: 100%; min-height: 84px; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-3);
    font-size: var(--text-sm); line-height: 1.6; color: var(--fg);
    background: var(--surface-warm); caret-color: var(--accent); outline: none;
    transition: border-color var(--motion-fast) var(--ease-standard);
}
.decision textarea::placeholder { color: var(--muted); }
.decision textarea:focus { border-color: var(--accent); }
.decision-foot {
    display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4);
}
.decision-foot .hint { font-size: var(--text-xs); color: var(--muted); flex: 1; }
.decision-foot button {
    min-height: 40px; padding: var(--space-2) var(--space-6);
    border-radius: var(--radius-sm); border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-on); font-size: var(--text-sm); font-weight: 700;
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.decision-foot button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.decision-foot button:active { opacity: .85; }

/* -- Toast + reload banner (mirror pr-review) -- */
.toast {
    position: fixed; bottom: var(--space-6); left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface-warm); color: var(--fg); border: 1px solid var(--border);
    padding: var(--space-2) var(--space-5); border-radius: var(--radius-sm);
    font-size: var(--text-sm); box-shadow: var(--elev-raised);
    transition: transform var(--motion-base) var(--ease-standard); pointer-events: none; z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.reload-banner {
    position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%);
    background: var(--surface-warm); color: var(--warn); padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-sm);
    display: flex; gap: var(--space-2); align-items: center;
    box-shadow: var(--elev-raised); border: 1px solid var(--warn);
    font-size: var(--text-sm); z-index: 110;
}
.reload-banner button {
    font-size: var(--text-sm); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm);
    border: 1px solid var(--warn); background: var(--warn); color: var(--accent-on); cursor: pointer;
    transition: opacity var(--motion-fast) var(--ease-standard);
}
.reload-banner button:active { opacity: .85; }
.reload-banner button.ghost { background: transparent; color: var(--warn); }
.hidden { display: none !important; }

@media (max-width: 600px) {
    .topbar { padding: var(--space-2) var(--container-gutter-phone); }
    main { padding: 0 var(--container-gutter-phone); margin: var(--space-4) auto var(--space-12); }
    .brief { padding: var(--space-5) var(--space-4); }
    .decision { padding: var(--space-4); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}
</style>
</head>
<body>
<header class="topbar">
    <span class="pill" id="badge">回饋</span>
    <h1 id="title">載入中…</h1>
    <div class="view-toggle hidden" id="view-toggle">
        <button data-view="cards" title="把選項排成並排卡片">圖卡</button><button data-view="plain" title="照 markdown 原文呈現">原文</button>
    </div>
    <div class="actions">
        <button id="save-btn" title="把你的回饋寫回原始 markdown">儲存回饋</button>
        <button id="export-btn" class="ghost" title="複製更新後的 markdown">複製</button>
        <button id="download-btn" class="ghost" title="下載為 .md">下載</button>
    </div>
</header>

<main>
    <div id="cards-view" class="hidden"></div>
    <article class="brief" id="brief"></article>
    <section class="decision" id="decision-panel"></section>
</main>

<div class="toast" id="toast"></div>
<div class="reload-banner hidden" id="reload-banner">
    <span>檔案在外部被改動。</span>
    <button id="reload-yes">重新載入</button>
    <button id="reload-no" class="ghost">保留我的</button>
</div>

<script>
window.SRC_B64 = "DOC_BASE64_PLACEHOLDER";
window.SRC_NAME = "DOC_NAME_PLACEHOLDER";
window.SRC_PATH = "SOURCE_PATH_PLACEHOLDER";
window.SRC_MTIME = "SOURCE_MTIME_PLACEHOLDER";
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
// @inline feedback.model.js
</script>
<script>
(function () {
    'use strict';

    var M = window.FeedbackModel;

    // Frontmatter-configurable labels, all optional (sensible defaults).
    var DEFAULTS = {
        badge: '回饋',
        panel: '你的回饋',
        promptWithOptions: '讀完上面後，選一個，按「儲存回饋」寫回給 agent。',
        promptNotesOnly: '在下方寫下你的回饋，按「儲存回饋」寫回給 agent。',
        notes_label: '回饋 / 理由（選填）',
        hint: '存回後，回終端機確認，agent 會讀取你的回饋。'
    };

    function decodeB64(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }
    function escapeHtml(s) {
        return String(s).replace(/[<>&]/g, function (c) {
            return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
        });
    }
    function cfg(model, key) {
        var v = (model.fm[key] || '').trim();
        return v || DEFAULTS[key];
    }

    var currentModel = null;
    var selected = '';        // chosen option label (single-question mode)
    var answers = {};         // round mode: question id → { choices: [], notes: '' }
    var notesValue = '';
    var isDirty = false;
    var dismissedMtime = 0;

    function markDirty() { isDirty = true; }

    function md(src) {
        return DOMPurify.sanitize(marked.parse(src), {
            ADD_TAGS: ['pre', 'span'], ADD_ATTR: ['class', 'language']
        });
    }
    function mdInline(src) {
        return DOMPurify.sanitize(marked.parseInline(String(src || '')));
    }
    function el(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
    }
    function rawOf(tokens) {
        return tokens.map(function (t) { return t.raw; }).join('');
    }

    function renderBody(body) {
        var briefEl = document.getElementById('brief');
        briefEl.innerHTML = md(body);
        decorate(briefEl);
    }

    function decorate(root) {
        // Wrap tables for horizontal scroll
        root.querySelectorAll('table').forEach(function (t) {
            if (t.parentElement.classList.contains('table-wrap')) return;
            var w = document.createElement('div'); w.className = 'table-wrap';
            t.parentNode.insertBefore(w, t); w.appendChild(t);
        });
        // Convert ```mermaid blocks to shells
        var mermaidNodes = [];
        root.querySelectorAll('code.language-mermaid').forEach(function (code) {
            var pre = code.parentElement;
            var shell = document.createElement('div'); shell.className = 'mermaid-shell';
            var div = document.createElement('div'); div.className = 'mermaid';
            div.textContent = code.textContent;
            shell.appendChild(div);
            pre.replaceWith(shell);
            mermaidNodes.push(div);
        });
        if (mermaidNodes.length && window.mermaid) {
            try {
                window.mermaid.initialize({
                    startOnLoad: false,
                    theme: 'base',
                    securityLevel: 'strict',
                    themeVariables: {
                        darkMode: true, background: 'transparent',
                        fontFamily: 'Fira Code, jf Open Huninn, PingFang TC, ui-monospace, monospace',
                        primaryColor: '#222222', primaryBorderColor: '#fd971f', primaryTextColor: '#e8e8e5',
                        secondaryColor: '#181818', secondaryBorderColor: '#75715e',
                        tertiaryColor: '#181818', tertiaryBorderColor: '#2e2e2e',
                        lineColor: '#75715e', nodeBorder: '#fd971f',
                        clusterBkg: '#181818', clusterBorder: '#2e2e2e',
                        edgeLabelBackground: '#222222', titleColor: '#fd971f'
                    }
                });
                window.mermaid.run({ nodes: mermaidNodes });
            } catch (e) { /* leave source visible on failure */ }
        }
    }

    // Option cards for one question. Selection state lives in the caller
    // (M.toggle decides it); this only paints and wires clicks.
    function optionList(opts, rec, multi, getChoices, onToggle) {
        var list = document.createElement('div'); list.className = 'opts';
        function paint() {
            var cur = getChoices();
            list.querySelectorAll('.opt').forEach(function (o) {
                o.classList.toggle('selected', cur.indexOf(o.dataset.label) !== -1);
            });
        }
        opts.forEach(function (label) {
            var row = document.createElement('div');
            row.className = 'opt';
            row.dataset.label = label;
            var dot = document.createElement('div'); dot.className = 'dot' + (multi ? ' multi' : '');
            var lab = document.createElement('div'); lab.className = 'label'; lab.textContent = label;
            row.appendChild(dot); row.appendChild(lab);
            if (rec && label === rec) {
                var tag = document.createElement('span'); tag.className = 'rec'; tag.textContent = '建議';
                row.appendChild(tag);
            }
            row.addEventListener('click', function () {
                onToggle(label); markDirty(); paint();
            });
            list.appendChild(row);
        });
        paint();
        return list;
    }

    function notesBox(labelText, value, onInput, id) {
        var frag = document.createDocumentFragment();
        var nl = document.createElement('label'); nl.className = 'notes-label';
        nl.textContent = labelText;
        var ta = document.createElement('textarea');
        if (id) { ta.id = id; nl.setAttribute('for', id); }
        ta.placeholder = '補充說明、保留意見，或要 agent 接著做的事…';
        ta.value = value;
        ta.addEventListener('input', function () { onInput(ta.value); markDirty(); });
        frag.appendChild(nl); frag.appendChild(ta);
        return frag;
    }

    // Answer state lives here, not in either view, so switching views keeps
    // unsaved picks and notes.
    function initAnswers(model) {
        selected = (model.fm.choice || '').trim();
        notesValue = M.getNotes(model);
        answers = {};
        M.questions(model).forEach(function (q) {
            answers[q.id] = { choices: q.choice.slice(), notes: q.notes };
        });
    }

    // One drawer per grid, opened under the whole row so a long detail never
    // stretches the cards it sits beside. Opening the source again closes it.
    function drawerFor(grid) {
        var drawer = null, source = null;
        function sync() {
            grid.querySelectorAll('.cv-more').forEach(function (b) {
                b.textContent = b.parentElement.classList.contains('cv-open') ? '收起 ▴' : '詳情 ▾';
            });
        }
        return function (title, tokens, from) {
            var reopen = source !== from;
            if (drawer) { drawer.remove(); drawer = null; source.classList.remove('cv-open'); source = null; }
            if (reopen) {
                source = from; from.classList.add('cv-open');
                drawer = el('div', 'cv-drawer');
                var head = el('div', 'head', '<span>' + mdInline(title) + '</span>');
                var close = el('button', null, '收起 ▴'); close.type = 'button';
                close.addEventListener('click', function () { from.querySelector('.cv-more').click(); });
                head.appendChild(close);
                drawer.appendChild(head);
                var body = el('div', 'prose', md(rawOf(tokens)));
                decorate(body);
                drawer.appendChild(body);
                grid.after(drawer);
            }
            sync();
        };
    }
    function moreButton(onOpen) {
        var b = el('button', 'cv-more', '詳情 ▾'); b.type = 'button';
        b.addEventListener('click', function (e) { e.stopPropagation(); onOpen(); });
        return b;
    }

    function tilesNode(block) {
        var grid = el('div', 'cv-tiles'), open = drawerFor(grid);
        block.tiles.forEach(function (t) {
            var tile = el('div', 'cv-tile');
            tile.appendChild(el('b', null, mdInline(t.title)));
            t.fields.forEach(function (f) {
                tile.appendChild(el('div', 'kv', '<span>' + mdInline(f.label) + '</span>' + mdInline(f.text)));
            });
            if (t.detail) {
                tile.classList.add('has-more');
                tile.appendChild(moreButton(function () { open(t.title, t.detail, tile); }));
                tile.addEventListener('click', function () { tile.querySelector('.cv-more').click(); });
            }
            grid.appendChild(tile);
        });
        return grid;
    }

    function cardsNode(q, block) {
        var grid = el('div', 'cv-cards'), open = drawerFor(grid);
        function paint() {
            var cur = answers[q.id].choices;
            grid.querySelectorAll('.cv-card').forEach(function (c) {
                var on = cur.indexOf(c.dataset.label) !== -1;
                c.classList.toggle('selected', on);
                c.querySelector('.cv-pick').textContent = q.multi
                    ? (on ? '☑ 保留' : '☐ 保留這個')
                    : (on ? '● 已選' : '○ 選這個');
            });
        }
        block.cards.forEach(function (c, i) {
            var card = el('div', 'cv-card' + (c.recommend ? ' rec' : ''));
            card.dataset.label = c.label;
            card.setAttribute('role', 'button'); card.tabIndex = 0;
            card.appendChild(el('div', 'name', (i < 20 ? String.fromCharCode(0x2460 + i) + ' ' : '') + mdInline(c.label)));
            if (c.recommend) card.appendChild(el('span', 'rec-tag', '建議'));
            if (c.pros.length || c.cons.length) {
                var ul = el('ul');
                c.pros.forEach(function (p) { ul.appendChild(el('li', 'pro', mdInline(p))); });
                c.cons.forEach(function (p) { ul.appendChild(el('li', 'con', mdInline(p))); });
                card.appendChild(ul);
            }
            c.extras.forEach(function (x) {
                card.appendChild(el('div', 'extra', '<span>' + mdInline(x.label) + '</span>' + mdInline(x.text)));
            });
            if (c.cost) {
                var meter = el('div', 'cv-meter');
                meter.dataset.level = c.cost.level;
                var bars = '';
                for (var k = 1; k <= 5; k++) bars += '<i class="' + (k <= c.cost.level ? 'on' : '') + '"></i>';
                meter.innerHTML = mdInline(c.cost.label) + ' ' + escapeHtml(c.cost.word)
                    + '<div class="bar">' + bars + '</div>'
                    + (c.cost.why ? '<div class="why">' + mdInline(c.cost.why) + '</div>' : '');
                card.appendChild(meter);
            }
            if (c.detail) card.appendChild(moreButton(function () { open(c.label, c.detail, card); }));
            card.appendChild(el('div', 'cv-pick'));
            function pick() {
                answers[q.id].choices = M.toggle(answers[q.id].choices, c.label, q.multi);
                markDirty(); paint();
            }
            card.addEventListener('click', pick);
            card.addEventListener('keydown', function (e) {
                if (e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(); }
            });
            grid.appendChild(card);
        });
        paint();
        return grid;
    }

    function renderCards(model, projection) {
        var root = document.getElementById('cards-view');
        root.innerHTML = '';
        var qs = {};
        M.questions(model).forEach(function (q) { qs[q.id] = q; });
        function flow(parent, blocks, q) {
            blocks.forEach(function (b) {
                if (b.type === 'cards') parent.appendChild(cardsNode(q, b));
                else if (b.type === 'tiles') parent.appendChild(tilesNode(b));
                else if (b.type === 'verdict') parent.appendChild(el('div', 'cv-verdict', md(b.token.text)));
                else if (b.token.type !== 'space') parent.appendChild(el('div', 'prose', md(b.token.raw)));
            });
        }
        root.appendChild(el('header', 'cv-hero prose', md(rawOf(projection.hero))));
        projection.sections.forEach(function (s) {
            if (s.kind === 'section') {
                root.appendChild(el('h2', 'cv-kicker', mdInline(s.title)));
                flow(root, s.blocks, null);
                return;
            }
            var q = qs[s.id];
            var box = el('section', 'cv-decision');
            var head = el('div', 'cv-q', '<span class="num">' + escapeHtml(q.id.toUpperCase()) + '</span><h2>' + mdInline(s.title) + '</h2>');
            if (q.multi) head.appendChild(el('span', 'multi-tag', '可複選'));
            box.appendChild(head);
            flow(box, s.blocks, q);
            box.appendChild(notesBox('這題的理由（選填）', answers[q.id].notes,
                function (v) { answers[q.id].notes = v; }));
            root.appendChild(box);
        });
        decorate(root);
    }

    var VIEW_KEY = 'viz-feedback-view';
    function preferredView() {
        try { return localStorage.getItem(VIEW_KEY) === 'plain' ? 'plain' : 'cards'; } catch (e) { return 'cards'; }
    }

    // 圖卡 is the default whenever the body projects; 原文 is always one click
    // away and is the only view when nothing in the body matches a question.
    function renderView() {
        var model = currentModel;
        var qs = M.questions(model);
        var projection = qs.length ? M.project(marked.lexer(model.body), qs) : { usable: false };
        var cards = projection.usable && preferredView() === 'cards';
        var toggle = document.getElementById('view-toggle');
        toggle.classList.toggle('hidden', !projection.usable);
        toggle.querySelectorAll('button').forEach(function (b) {
            b.classList.toggle('on', (b.dataset.view === 'cards') === cards);
        });
        document.querySelector('main').classList.toggle('wide', cards);
        document.getElementById('cards-view').classList.toggle('hidden', !cards);
        document.getElementById('brief').classList.toggle('hidden', cards);
        if (cards) renderCards(model, projection);
        else renderBody(model.body);
        renderPanel(model, cards);
    }

    function renderPanel(model, questionsInline) {
        var panel = document.getElementById('decision-panel');
        var qs = M.questions(model);
        var opts = M.options(model);
        var rec = (model.fm.recommend || '').trim();

        panel.innerHTML = '';
        var h = document.createElement('h2'); h.textContent = cfg(model, 'panel');
        var sub = document.createElement('div'); sub.className = 'sub';
        sub.textContent = (model.fm.prompt || '').trim()
            || ((qs.length || opts.length) ? DEFAULTS.promptWithOptions : DEFAULTS.promptNotesOnly);
        panel.appendChild(h); panel.appendChild(sub);

        if (qs.length && !questionsInline) {
            qs.forEach(function (q) {
                var block = document.createElement('div'); block.className = 'question';
                var qh = document.createElement('h3'); qh.className = 'q-title';
                qh.appendChild(document.createTextNode(q.title || q.id));
                if (q.multi) {
                    var mt = document.createElement('span'); mt.className = 'multi-tag';
                    mt.textContent = '可複選'; qh.appendChild(mt);
                }
                block.appendChild(qh);
                if (q.options.length) {
                    block.appendChild(optionList(q.options, q.recommend, q.multi,
                        function () { return answers[q.id].choices; },
                        function (label) {
                            answers[q.id].choices = M.toggle(answers[q.id].choices, label, q.multi);
                        }));
                }
                block.appendChild(notesBox('這題的理由（選填）', answers[q.id].notes,
                    function (v) { answers[q.id].notes = v; }));
                panel.appendChild(block);
            });
        } else if (!qs.length && opts.length) {
            panel.appendChild(optionList(opts, rec, false,
                function () { return selected ? [selected] : []; },
                function (label) { selected = M.toggle(selected ? [selected] : [], label, false)[0] || ''; }));
        }

        panel.appendChild(notesBox(cfg(model, 'notes_label'), notesValue,
            function (v) { notesValue = v; }, 'notes'));

        var foot = document.createElement('div'); foot.className = 'decision-foot';
        var hint = document.createElement('span'); hint.className = 'hint';
        hint.textContent = DEFAULTS.hint;
        var btn = document.createElement('button'); btn.textContent = '儲存回饋';
        btn.addEventListener('click', function () { saveToServer(); });
        foot.appendChild(hint); foot.appendChild(btn);
        panel.appendChild(foot);
    }

    function applyMarkdown(md, mtime) {
        currentModel = M.parse(md);
        document.getElementById('badge').textContent = cfg(currentModel, 'badge');
        document.getElementById('title').textContent = currentModel.fm.title || '回饋';
        document.title = currentModel.fm.title || (window.SRC_NAME || 'feedback');
        initAnswers(currentModel);
        renderView();
        if (mtime != null) window.SRC_MTIME = String(mtime);
        isDirty = false; dismissedMtime = 0;
    }

    function fetchAndApply() {
        if (!window.SRC_PATH || location.protocol === 'file:') return Promise.resolve(false);
        return fetch('/api/read?path=' + encodeURIComponent(window.SRC_PATH))
            .then(function (res) { return res.json().then(function (d) { return { status: res.status, data: d }; }); })
            .then(function (r) {
                if (r.status === 200) { applyMarkdown(r.data.content, r.data.mtime); return true; }
                return false;
            })
            .catch(function () { return false; });
    }

    function checkRemote() {
        if (!window.SRC_PATH || location.protocol === 'file:') return;
        fetch('/api/stat?path=' + encodeURIComponent(window.SRC_PATH))
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (d) {
                if (!d || d.mtime == null) return;
                var local = window.SRC_MTIME ? parseFloat(window.SRC_MTIME) : 0;
                if (d.mtime - local <= 0.001) return;
                if (isDirty) {
                    if (d.mtime > dismissedMtime + 0.001) showReloadBanner(d.mtime);
                } else {
                    fetchAndApply().then(function (ok) { if (ok) showToast('↻ 已從磁碟重新載入'); });
                }
            })
            .catch(function () {});
    }

    function showReloadBanner(remoteMtime) {
        var b = document.getElementById('reload-banner');
        b.dataset.remoteMtime = String(remoteMtime); b.classList.remove('hidden');
    }
    function hideReloadBanner() { document.getElementById('reload-banner').classList.add('hidden'); }

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function () { t.classList.remove('show'); }, 2000);
    }

    function downloadMarkdown(md) {
        var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (window.SRC_NAME || 'feedback').replace(/^doc-/, '') + '.md';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }

    function commitFeedback() {
        var qs = M.questions(currentModel);
        if (!qs.length) { M.setFeedback(currentModel, selected, notesValue); return; }
        qs.forEach(function (q) {
            var a = answers[q.id] || { choices: [], notes: '' };
            M.setAnswer(currentModel, q.id, a.choices, a.notes);
        });
        M.setNotes(currentModel, notesValue);
    }

    function saveToServer() {
        if (!currentModel) { showToast('還在載入…'); return; }
        if (!window.SRC_PATH || window.SRC_PATH.indexOf('/') !== 0) {
            showToast('沒有來源路徑（file:// 開啟）— 改用「複製」貼回 agent');
            return;
        }
        commitFeedback();
        var md = M.serialize(currentModel);
        var clientMtime = window.SRC_MTIME ? parseFloat(window.SRC_MTIME) : null;
        fetch('/api/save', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: window.SRC_PATH, content: md, mtime: isFinite(clientMtime) ? clientMtime : null })
        }).then(function (res) {
            return res.json().then(function (data) { return { status: res.status, data: data }; });
        }).then(function (r) {
            if (r.status === 200) {
                window.SRC_MTIME = String(r.data.mtime); isDirty = false;
                showToast(selected ? ('已儲存：' + selected + ' — 回終端機確認') : '已儲存回饋 — 回終端機確認');
            } else if (r.status === 409) {
                window.SRC_MTIME = String(r.data.current_mtime);
                showToast('檔案在外部被改動 — 再按一次「儲存回饋」覆蓋');
            } else {
                showToast('儲存失敗：' + (r.data.error || r.status));
            }
        }).catch(function (e) {
            showToast('儲存失敗：' + e.message + '（server 沒開？改用「複製」）');
        });
    }

    window.addEventListener('load', function () {
        try {
            if (location.protocol === 'file:') {
                document.getElementById('save-btn').style.display = 'none';
            }
            document.getElementById('save-btn').addEventListener('click', saveToServer);
            document.querySelectorAll('#view-toggle button').forEach(function (b) {
                b.addEventListener('click', function () {
                    try { localStorage.setItem(VIEW_KEY, b.dataset.view); } catch (e) { /* view just won't persist */ }
                    if (currentModel) renderView();
                });
            });
            document.getElementById('export-btn').addEventListener('click', function () {
                if (!currentModel) return;
                commitFeedback();
                var out = M.serialize(currentModel);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(out)
                        .then(function () { showToast('已複製更新後的 markdown — 貼回給 agent'); })
                        .catch(function () { downloadMarkdown(out); showToast('剪貼簿被擋 — 改為下載'); });
                } else { downloadMarkdown(out); showToast('已下載 markdown'); }
            });
            document.getElementById('download-btn').addEventListener('click', function () {
                if (!currentModel) return;
                commitFeedback(); downloadMarkdown(M.serialize(currentModel)); showToast('已下載 markdown');
            });

            // Prefer live fetch; embedded base64 is a render-time snapshot.
            if (window.SRC_PATH && location.protocol !== 'file:') {
                fetchAndApply().then(function (ok) { if (!ok) applyMarkdown(decodeB64(window.SRC_B64), null); });
            } else {
                applyMarkdown(decodeB64(window.SRC_B64), null);
            }

            document.getElementById('reload-yes').addEventListener('click', function () {
                hideReloadBanner();
                fetchAndApply().then(function (ok) { if (ok) showToast('↻ 已從磁碟重新載入'); });
            });
            document.getElementById('reload-no').addEventListener('click', function () {
                var b = document.getElementById('reload-banner');
                dismissedMtime = parseFloat(b.dataset.remoteMtime || '0') || 0;
                hideReloadBanner();
            });

            if (window.SRC_PATH && location.protocol !== 'file:') {
                setInterval(function () { if (document.visibilityState === 'visible') checkRemote(); }, 2000);
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') checkRemote();
                });
            }
        } catch (err) {
            document.body.innerHTML = '<pre style="padding:24px;color:#f4005f;font-family:monospace">'
                + escapeHtml('Recipe error: ' + (err && err.message ? err.message : err)) + '</pre>';
            console.error(err);
        }
    });
