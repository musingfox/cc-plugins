<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOC_NAME_PLACEHOLDER</title>
<style>
/* musingfox standalone token contract. */
:root {
    --bg: #07080a;
    --surface: #181818;
    --surface-warm: #222222;

    --fg: #e8e8e5;
    --fg-2: #c4c5b5;
    --muted: #75715e;
    --meta: #49483e;

    --border: #2e2e2e;
    --border-soft: #1f1f1f;

    --accent: #fd971f;
    --accent-on: #07080a;
    --accent-hover: #ffb85a;
    --accent-active: #c97608;

    --success: #98e024;
    --warn: #e0d561;
    --danger: #f4005f;

    --font-display: "Fira Code", "jf Open Huninn", "PingFang TC", "Microsoft JhengHei", ui-monospace, monospace;
    --font-body: "Fira Code", "jf Open Huninn", "PingFang TC", "Microsoft JhengHei", ui-monospace, monospace;
    --font-mono: "Fira Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --text-xs: 11px;
    --text-sm: 13px;
    --text-base: 16px;
    --text-lg: 20px;
    --text-xl: 28px;

    --leading-body: 1.55;
    --leading-tight: 1.15;
    --tracking-display: -0.02em;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-12: 48px;

    --radius-sm: 4px;
    --radius-md: 4px;
    --radius-lg: 10px;
    --radius-pill: 9999px;

    --elev-raised: 0 4px 16px rgb(0 0 0 / 50%);
    --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--accent);

    --motion-fast: 120ms;
    --motion-base: 200ms;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);

    --container-gutter-desktop: 24px;
    --container-gutter-phone: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; background: var(--bg); }
body {
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: var(--leading-body);
    color: var(--fg);
    background:
        radial-gradient(circle at 82% 4%, color-mix(in srgb, var(--accent), transparent 88%), transparent 34rem),
        linear-gradient(var(--border-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-soft) 1px, transparent 1px),
        var(--bg);
    background-size: auto, 32px 32px, 32px 32px, auto;
    background-attachment: fixed;
    font-variant-ligatures: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
button, input { font: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible,
.status-badge:focus-visible, .editable:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
}

.topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: var(--space-3) var(--space-6);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3);
}
.topbar h1 { font-family: var(--font-display); font-size: var(--text-base); font-weight: 700; flex: 1 0 auto; min-width: 200px; }
.filters { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.filters button {
    min-height: 28px; padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--surface-warm); color: var(--fg-2);
    font-size: var(--text-xs); cursor: pointer;
    transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.filters button:hover { border-color: var(--accent); color: var(--accent); }
.filters button:active { opacity: .85; }
.filters button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.actions { display: flex; gap: var(--space-2); }
.actions button {
    min-height: 32px; padding: var(--space-1) var(--space-4); border-radius: var(--radius-sm);
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-on);
    font-size: var(--text-sm); cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.actions button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.actions button:active { opacity: .85; }
.actions button.ghost { background: var(--surface); color: var(--fg); border-color: var(--border); }
.actions button.ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--surface); }

main { max-width: 960px; margin: var(--space-6) auto var(--space-12); padding: 0 var(--container-gutter-desktop); }

.summary-card {
    background: var(--surface); border-radius: var(--radius-md); padding: var(--space-5);
    margin-bottom: var(--space-6); border: 1px solid var(--border);
}
.summary-card h2 {
    font-family: var(--font-display);
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--accent); font-weight: 700; margin-bottom: var(--space-2);
}
.editable { outline: none; caret-color: var(--accent); border-radius: var(--radius-sm); }
.editable:focus { background: var(--surface-warm); }
.summary-body { min-height: 1.5em; white-space: pre-wrap; color: var(--fg-2); }

.severity-group { margin-bottom: var(--space-6); }
.severity-header {
    display: flex; align-items: baseline; gap: var(--space-3);
    margin-bottom: var(--space-2); padding: 0 var(--space-1);
}
.severity-header h2 {
    font-family: var(--font-display);
    font-size: var(--text-sm); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em;
}
.severity-header .count {
    font-size: var(--text-xs); color: var(--muted); font-weight: normal;
    font-variant-numeric: tabular-nums;
}

.finding {
    background: var(--surface); border-radius: var(--radius-md);
    margin-bottom: var(--space-2); border: 1px solid var(--border);
    border-left: 2px solid var(--muted);
    padding: var(--space-4);
    transition: opacity var(--motion-base) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.finding:hover { border-color: var(--accent); }
.finding[data-status="fixed"]   { opacity: 0.55; }
.finding[data-status="wontfix"] { opacity: 0.42; }
.finding[data-severity="High"]     { border-left-color: var(--danger); }
.finding[data-severity="Critical"] { border-left-color: var(--danger); }
.finding[data-severity="Medium"]   { border-left-color: var(--warn); }
.finding[data-severity="Low"]      { border-left-color: var(--success); }
.finding[data-severity="Info"]     { border-left-color: var(--muted); }

.finding-head {
    display: flex; align-items: flex-start; gap: var(--space-3);
    margin-bottom: var(--space-2);
}
.finding-title {
    flex: 1; font-size: var(--text-base); font-weight: 700; line-height: 1.4;
}
.status-badge {
    display: inline-flex; align-items: center;
    padding: 1px var(--space-2); border-radius: var(--radius-pill);
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer; user-select: none;
    background: transparent;
    border: 1px solid; flex-shrink: 0;
    transition: opacity var(--motion-fast) var(--ease-standard);
}
.status-badge[data-status="open"]    { color: var(--danger); border-color: var(--danger); }
.status-badge[data-status="fixed"]   { color: var(--success); border-color: var(--success); }
.status-badge[data-status="wontfix"] { color: var(--muted); border-color: var(--muted); }
.status-badge:hover { opacity: .8; }
.status-badge:active { opacity: .6; }

.meta {
    display: grid; grid-template-columns: 70px 1fr; gap: var(--space-1) var(--space-3);
    font-size: var(--text-sm);
}
.meta .k {
    color: var(--muted); font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: 0.12em; padding-top: var(--space-1); user-select: none;
}
.meta .v { padding: 2px 0; color: var(--fg-2); }
.meta .v code {
    background: var(--surface-warm); padding: 1px var(--space-1);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2);
}

.toast {
    position: fixed; bottom: var(--space-6); left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface-warm); color: var(--fg); border: 1px solid var(--border);
    padding: var(--space-2) var(--space-5); border-radius: var(--radius-sm);
    font-size: var(--text-sm); box-shadow: var(--elev-raised);
    transition: transform var(--motion-base) var(--ease-standard);
    pointer-events: none; z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.reload-banner {
    position: fixed; bottom: var(--space-6); left: 50%;
    transform: translateX(-50%);
    background: var(--surface-warm); color: var(--warn);
    padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm);
    display: flex; gap: var(--space-2); align-items: center;
    box-shadow: var(--elev-raised);
    border: 1px solid var(--warn);
    font-size: var(--text-sm); z-index: 110;
}
.reload-banner button {
    font-size: var(--text-sm);
    padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm);
    border: 1px solid var(--warn); background: var(--warn); color: var(--accent-on);
    cursor: pointer;
    transition: opacity var(--motion-fast) var(--ease-standard);
}
.reload-banner button:active { opacity: .85; }
.reload-banner button.ghost {
    background: transparent; color: var(--warn);
}

.hidden { display: none !important; }
.empty {
    color: var(--muted); padding: var(--space-12) 0; text-align: center;
}

@media (max-width: 600px) {
    .topbar { padding: var(--space-2) var(--container-gutter-phone); }
    main { padding: 0 var(--container-gutter-phone); margin: var(--space-4) auto var(--space-12); }
    .meta { grid-template-columns: 60px 1fr; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}
</style>
</head>
<body>
<header class="topbar">
    <h1 id="title">Loading…</h1>
    <div class="filters" id="filters"></div>
    <div class="actions">
        <button id="save-btn" title="Write back to source markdown">Save</button>
        <button id="export-btn" class="ghost" title="Copy updated markdown to clipboard">Export</button>
        <button id="download-btn" class="ghost" title="Download as .md">Download</button>
    </div>
</header>

<main>
    <section class="summary-card" id="summary-card">
        <h2>Summary</h2>
        <div class="summary-body editable" id="summary" contenteditable="true"></div>
    </section>
    <section id="findings"></section>
</main>

<div class="toast" id="toast"></div>
<div class="reload-banner hidden" id="reload-banner">
    <span>File changed externally.</span>
    <button id="reload-yes">Reload</button>
    <button id="reload-no" class="ghost">Keep mine</button>
</div>

<script>
window.SRC_B64 = "DOC_BASE64_PLACEHOLDER";
window.SRC_NAME = "DOC_NAME_PLACEHOLDER";
window.SRC_PATH = "SOURCE_PATH_PLACEHOLDER";
window.SRC_MTIME = "SOURCE_MTIME_PLACEHOLDER";
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script>
// @inline pr-review.model.js
</script>
<script>
(function() {
    'use strict';

    var STATUSES = ['open', 'fixed', 'wontfix'];
    var CODE_FIELDS = new Set(['file', 'path', 'location']);

    var parseModel = window.PRReviewModel.parseModel;
    var serializeModel = window.PRReviewModel.serializeModel;

    function decodeB64(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function escapeHtml(s) {
        return String(s).replace(/[<>&]/g, function(c) {
            return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
        });
    }

    function el(tag, attrs) {
        var e = document.createElement(tag);
        if (attrs) {
            for (var k in attrs) {
                var v = attrs[k];
                if (k === 'class') e.className = v;
                else if (k === 'dataset') for (var dk in v) e.dataset[dk] = v[dk];
                else if (k === 'on') for (var ev in v) e.addEventListener(ev, v[ev]);
                else if (k === 'html') e.innerHTML = v;
                else if (k === 'contenteditable') e.contentEditable = v ? 'true' : 'false';
                else e.setAttribute(k, v);
            }
        }
        for (var i = 2; i < arguments.length; i++) {
            var c = arguments[i];
            if (c == null) continue;
            e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        }
        return e;
    }

    function renderMetaValue(k, v) {
        var lower = k.toLowerCase();
        if (CODE_FIELDS.has(lower)) {
            return '<code>' + escapeHtml(v) + '</code>';
        }
        return escapeHtml(v);
    }

    var currentModel = null;
    var isDirty = false;
    var dismissedMtime = 0;
    var pollHandle = null;

    function markDirty() { isDirty = true; }

    function renderFinding(model, sectionIdx, findingIdx) {
        var f = model.sections[sectionIdx].findings[findingIdx];
        var sev = model.sections[sectionIdx].severity;
        var status = (f.meta.status || 'open').toLowerCase();
        if (STATUSES.indexOf(status) === -1) status = 'open';
        f.meta.status = status;
        if (f.metaOrder.indexOf('status') === -1) f.metaOrder.push('status');

        var titleEl = el('div', {
            class: 'finding-title editable',
            contenteditable: true,
            on: {
                input: function(e) { f.title = e.target.textContent.trim(); markDirty(); }
            }
        }, f.title);

        var badge = el('div', {
            class: 'status-badge',
            dataset: { status: status }
        }, status);

        var metaGrid = el('div', { class: 'meta' });
        f.metaOrder.forEach(function(k) {
            if (k === 'status') return;
            var v = f.meta[k] || '';
            var keyEl = el('div', { class: 'k' }, k);
            var valEl = el('div', {
                class: 'v editable',
                contenteditable: true,
                html: renderMetaValue(k, v),
                on: {
                    input: function(e) { f.meta[k] = e.target.textContent.trim(); markDirty(); },
                    blur: function(e) {
                        e.target.innerHTML = renderMetaValue(k, e.target.textContent.trim());
                    }
                }
            });
            metaGrid.appendChild(keyEl);
            metaGrid.appendChild(valEl);
        });

        var card = el('div', {
            class: 'finding',
            dataset: { severity: sev, status: status }
        },
            el('div', { class: 'finding-head' }, titleEl, badge),
            metaGrid
        );

        badge.addEventListener('click', function() {
            var cur = STATUSES.indexOf(badge.dataset.status);
            var next = STATUSES[(cur + 1) % STATUSES.length];
            badge.dataset.status = next;
            badge.textContent = next;
            f.meta.status = next;
            card.dataset.status = next;
            markDirty();
        });

        return card;
    }

    function render(model) {
        var title = model.fm.title || 'PR Review';
        document.getElementById('title').textContent = title;
        document.title = title;

        var sumEl = document.getElementById('summary');
        sumEl.textContent = model.summary;
        sumEl.oninput = function(e) {
            model.summary = e.target.textContent;
            markDirty();
        };

        var findingsEl = document.getElementById('findings');
        findingsEl.innerHTML = '';
        if (model.sections.length === 0) {
            findingsEl.appendChild(el('div', { class: 'empty' },
                'No findings. Add `## High` / `## Medium` / `## Low` sections with `### Title` items.'));
        }
        model.sections.forEach(function(sec, si) {
            var group = el('div', {
                class: 'severity-group',
                dataset: { severity: sec.severity }
            }, el('div', { class: 'severity-header' },
                el('h2', null, sec.severity),
                el('span', { class: 'count' },
                    sec.findings.length + (sec.findings.length === 1 ? ' finding' : ' findings'))
            ));
            sec.findings.forEach(function(_, fi) {
                group.appendChild(renderFinding(model, si, fi));
            });
            findingsEl.appendChild(group);
        });

        var filtersEl = document.getElementById('filters');
        filtersEl.innerHTML = '';
        var allBtn = el('button', { dataset: { filter: 'all' }, class: 'active' }, 'All');
        filtersEl.appendChild(allBtn);
        model.sections.forEach(function(sec) {
            filtersEl.appendChild(el('button', { dataset: { filter: sec.severity } }, sec.severity));
        });
        filtersEl.onclick = function(e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            filtersEl.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var f = btn.dataset.filter;
            document.querySelectorAll('.severity-group').forEach(function(g) {
                g.classList.toggle('hidden', f !== 'all' && g.dataset.severity !== f);
            });
        };
    }

    function applyMarkdown(md, mtime) {
        currentModel = parseModel(md);
        render(currentModel);
        if (mtime != null) window.SRC_MTIME = String(mtime);
        isDirty = false;
        dismissedMtime = 0;
    }

    function fetchAndApply() {
        if (!window.SRC_PATH || location.protocol === 'file:') {
            return Promise.resolve(false);
        }
        return fetch('/api/read?path=' + encodeURIComponent(window.SRC_PATH))
            .then(function(res) {
                return res.json().then(function(d) { return { status: res.status, data: d }; });
            })
            .then(function(r) {
                if (r.status === 200) {
                    applyMarkdown(r.data.content, r.data.mtime);
                    return true;
                }
                return false;
            })
            .catch(function() { return false; });
    }

    function checkRemote() {
        if (!window.SRC_PATH || location.protocol === 'file:') return;
        fetch('/api/stat?path=' + encodeURIComponent(window.SRC_PATH))
            .then(function(res) { return res.ok ? res.json() : null; })
            .then(function(d) {
                if (!d || d.mtime == null) return;
                var local = window.SRC_MTIME ? parseFloat(window.SRC_MTIME) : 0;
                if (d.mtime - local <= 0.001) return;
                if (isDirty) {
                    if (d.mtime > dismissedMtime + 0.001) {
                        showReloadBanner(d.mtime);
                    }
                } else {
                    fetchAndApply().then(function(ok) {
                        if (ok) showToast('↻ Reloaded from disk');
                    });
                }
            })
            .catch(function() {});
    }

    function showReloadBanner(remoteMtime) {
        var banner = document.getElementById('reload-banner');
        banner.dataset.remoteMtime = String(remoteMtime);
        banner.classList.remove('hidden');
    }

    function hideReloadBanner() {
        document.getElementById('reload-banner').classList.add('hidden');
    }

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 1800);
    }

    function downloadMarkdown(md) {
        var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (window.SRC_NAME || 'review').replace(/^doc-/, '') + '.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
    }

    function saveToServer(model) {
        if (!window.SRC_PATH || window.SRC_PATH.indexOf('/') !== 0) {
            showToast('No source path — opened via file://, use Export instead');
            return;
        }
        var md = serializeModel(model);
        var clientMtime = window.SRC_MTIME ? parseFloat(window.SRC_MTIME) : null;
        fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                path: window.SRC_PATH,
                content: md,
                mtime: isFinite(clientMtime) ? clientMtime : null
            })
        }).then(function(res) {
            return res.json().then(function(data) { return { status: res.status, data: data }; });
        }).then(function(r) {
            if (r.status === 200) {
                window.SRC_MTIME = String(r.data.mtime);
                var name = window.SRC_PATH.split('/').pop();
                showToast('Saved → ' + name);
            } else if (r.status === 409) {
                window.SRC_MTIME = String(r.data.current_mtime);
                showToast('File changed externally — click Save again to overwrite');
            } else {
                showToast('Save failed: ' + (r.data.error || r.status));
            }
        }).catch(function(e) {
            showToast('Save failed: ' + e.message + ' (server down? use Export)');
        });
    }

    function withModel(fn) {
        if (!currentModel) { showToast('Still loading…'); return; }
        fn(currentModel);
    }

    window.addEventListener('load', function() {
        try {
            // Hide Save when running off file:// (no server reachable)
            if (location.protocol === 'file:') {
                document.getElementById('save-btn').style.display = 'none';
            }

            document.getElementById('save-btn').addEventListener('click', function() {
                withModel(saveToServer);
            });

            document.getElementById('export-btn').addEventListener('click', function() {
                withModel(function(model) {
                    var out = serializeModel(model);
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(out).then(function() {
                            showToast('Updated markdown copied — paste back to your agent');
                        }).catch(function() {
                            downloadMarkdown(out);
                            showToast('Clipboard blocked — downloaded instead');
                        });
                    } else {
                        downloadMarkdown(out);
                        showToast('Downloaded markdown');
                    }
                });
            });

            document.getElementById('download-btn').addEventListener('click', function() {
                withModel(function(model) {
                    downloadMarkdown(serializeModel(model));
                    showToast('Downloaded markdown');
                });
            });

            // Initial content: prefer live fetch (HTML's embedded base64 is
            // a render-time snapshot — stale on refresh). Fall back to it
            // only if /api/read is unreachable (file:// or server down).
            if (window.SRC_PATH && location.protocol !== 'file:') {
                fetchAndApply().then(function(ok) {
                    if (!ok) applyMarkdown(decodeB64(window.SRC_B64), null);
                });
            } else {
                applyMarkdown(decodeB64(window.SRC_B64), null);
            }

            document.getElementById('reload-yes').addEventListener('click', function() {
                hideReloadBanner();
                fetchAndApply().then(function(ok) {
                    if (ok) showToast('↻ Reloaded from disk');
                });
            });
            document.getElementById('reload-no').addEventListener('click', function() {
                var banner = document.getElementById('reload-banner');
                dismissedMtime = parseFloat(banner.dataset.remoteMtime || '0') || 0;
                hideReloadBanner();
            });

            // Live-reload: poll mtime every 2s while tab is visible
            if (window.SRC_PATH && location.protocol !== 'file:') {
                pollHandle = setInterval(function() {
                    if (document.visibilityState === 'visible') checkRemote();
                }, 2000);
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible') checkRemote();
                });
            }
        } catch (err) {
            document.body.innerHTML = '<pre style="padding:24px;color:#f4005f;font-family:monospace">'
                + escapeHtml('Recipe error: ' + (err && err.message ? err.message : err))
                + '</pre>';
            console.error(err);
        }
    });
})();
</script>
</body>
</html>
