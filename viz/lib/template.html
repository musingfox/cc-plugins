<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOC_NAME_PLACEHOLDER</title>

    <!-- Code highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@latest/build/styles/monokai.min.css" id="hljs-theme">

    <!-- KaTeX math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.33/dist/katex.min.css">

    <style>
        /* musingfox standalone token contract. */
        :root {
            --bg: #07080a;
            --surface: #181818;
            --surface-warm: #222222;

            --fg: #e8e8e5;
            --fg-2: #c4c5b5;
            --muted: #75715e;
            --meta: #49483e;

            --border: #2e2e2e;
            --border-soft: #1f1f1f;

            --accent: #fd971f;
            --accent-on: #07080a;
            --accent-hover: #ffb85a;
            --accent-active: #c97608;

            --success: #98e024;
            --warn: #e0d561;
            --danger: #f4005f;

            --font-display: "Fira Code", "jf Open Huninn", "PingFang TC", "Microsoft JhengHei", ui-monospace, monospace;
            --font-body: "Fira Code", "jf Open Huninn", "PingFang TC", "Microsoft JhengHei", ui-monospace, monospace;
            --font-mono: "Fira Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

            --text-xs: 11px;
            --text-sm: 13px;
            --text-base: 16px;
            --text-lg: 20px;
            --text-xl: 28px;
            --text-2xl: 36px;
            --text-3xl: 48px;
            --text-4xl: 64px;

            --leading-body: 1.55;
            --leading-tight: 1.15;
            --tracking-display: -0.02em;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;
            --section-y-desktop: 80px;
            --section-y-tablet: 48px;
            --section-y-phone: 32px;

            --radius-sm: 4px;
            --radius-md: 4px;
            --radius-lg: 10px;
            --radius-pill: 9999px;

            --elev-flat: none;
            --elev-ring: 0 0 0 1px var(--border);
            --elev-raised: 0 4px 16px rgb(0 0 0 / 50%);

            --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--accent);

            --motion-fast: 120ms;
            --motion-base: 200ms;
            --ease-standard: cubic-bezier(0.2, 0, 0, 1);

            --container-max: 1200px;
            --container-gutter-desktop: 24px;
            --container-gutter-tablet: 16px;
            --container-gutter-phone: 12px;

            /* Reading measure. The design system's 640px prose column assumes a
               proportional face; the whole UI is monospace here, which is ~20%
               wider per character, so the column is widened to keep a
               comparable character count per line. */
            --measure: 860px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* The canvas carries the 32px grid and the off-center ember vignette;
           the body is only a reading column, so it stays transparent. */
        html {
            color-scheme: dark;
            background:
                radial-gradient(circle at 82% 4%, color-mix(in srgb, var(--accent), transparent 88%), transparent 34rem),
                linear-gradient(var(--border-soft) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-soft) 1px, transparent 1px),
                var(--bg);
            background-size: auto, 32px 32px, 32px 32px, auto;
            background-attachment: fixed;
        }

        body {
            max-width: calc(var(--measure) + 2 * var(--container-gutter-desktop));
            margin: var(--space-12) auto;
            padding: 0 var(--container-gutter-desktop);
            font-family: var(--font-body);
            font-size: var(--text-base);
            line-height: 1.7;
            color: var(--fg);
            background: transparent;
            font-synthesis: none;
            font-variant-ligatures: none;
            font-variant-numeric: tabular-nums lining-nums;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection { background: color-mix(in srgb, var(--accent), transparent 72%); color: var(--fg); }

        button, input, summary { font: inherit; }
        button, a, input, summary { -webkit-tap-highlight-color: transparent; }
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        summary:focus-visible,
        .mermaid-viewport:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        /* -- Typography -- */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            margin-top: var(--space-8);
            margin-bottom: var(--space-3);
            font-weight: 700;
            line-height: var(--leading-tight);
            color: var(--fg);
        }
        h1 {
            font-size: var(--text-xl);
            letter-spacing: var(--tracking-display);
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--space-3);
        }
        h2 { font-size: var(--text-lg); border-bottom: 1px solid var(--border-soft); padding-bottom: var(--space-2); }
        h3 { font-size: var(--text-base); }
        /* `›` is the system's universal forward marker — the section mark for
           top-level sections, never applied to TOC copies of the same text. */
        #content > h2::before { content: '\203A  '; color: var(--accent); }

        p { margin: var(--space-3) 0; }
        a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard); }
        a:hover { border-bottom-color: var(--accent); }
        a:active { opacity: .85; }

        /* -- Inline code -- */
        code {
            background: var(--surface-warm);
            padding: 1px var(--space-1);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            color: var(--fg-2);
        }

        /* -- Code blocks: terminal panels, so square corners -- */
        .code-block {
            margin: var(--space-5) 0;
            border-radius: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: border-color var(--motion-fast) var(--ease-standard);
        }
        .code-block:hover { border-color: var(--accent); }
        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-1) var(--space-3);
            background: var(--surface-warm);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--muted);
            letter-spacing: .12em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            user-select: none;
        }
        .code-header .copy-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--muted);
            font-size: var(--text-xs);
            padding: 1px var(--space-2);
            cursor: pointer;
            font-family: inherit;
            text-transform: lowercase;
            transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
        }
        .code-header .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
        .code-header .copy-btn:active { opacity: .85; }

        pre {
            background: var(--surface);
            padding: var(--space-4);
            overflow-x: auto;
            margin: 0;
        }

        pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--fg-2);
            font-size: var(--text-sm);
            line-height: 1.6;
            border-radius: 0;
        }

        /* Standalone pre (no code-block wrapper yet) */
        #content > pre,
        #content > details > pre {
            border-radius: 0;
            border: 1px solid var(--border);
            margin: var(--space-5) 0;
            padding: var(--space-4);
        }

        /* -- Tables -- */
        .table-wrap {
            overflow-x: auto;
            margin: var(--space-5) 0;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface);
            transition: border-color var(--motion-fast) var(--ease-standard);
        }
        .table-wrap:hover { border-color: var(--accent); }
        table { border-collapse: collapse; width: 100%; margin: 0; }
        th, td { padding: var(--space-2) var(--space-3); text-align: left; font-size: var(--text-sm); }
        th {
            font-weight: 700;
            color: var(--fg-2);
            background: var(--surface-warm);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1;
            white-space: nowrap;
        }
        td { border-bottom: 1px solid var(--border-soft); color: var(--fg-2); font-variant-numeric: tabular-nums; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--surface-warm); }

        /* -- Blockquote -- */
        blockquote {
            border-left: 2px solid var(--accent);
            margin: var(--space-5) 0;
            padding: var(--space-3) var(--space-5);
            background: var(--surface);
            color: var(--fg-2);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        blockquote p:first-child { margin-top: 0; }
        blockquote p:last-child { margin-bottom: 0; }

        /* -- Lists -- */
        ul, ol { padding-left: var(--space-6); margin: var(--space-2) 0; }
        li { margin: var(--space-1) 0; }
        li > ul, li > ol { margin: 0; }
        li::marker { color: var(--muted); }

        /* -- Other elements -- */
        hr { border: none; border-top: 1px solid var(--border); margin: var(--space-8) 0; }
        img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }

        /* Checkbox styling */
        input[type="checkbox"] {
            margin-right: var(--space-2);
            accent-color: var(--accent);
        }

        /* -- Mermaid diagrams -- */
        .mermaid-shell {
            position: relative;
            margin: var(--space-5) 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--surface);
            transition: border-color var(--motion-fast) var(--ease-standard);
        }
        .mermaid-shell:hover { border-color: var(--accent); }
        .zoom-controls {
            position: absolute; top: var(--space-2); right: var(--space-2);
            display: flex; gap: var(--space-1); z-index: 10;
            opacity: 0; transition: opacity var(--motion-base) var(--ease-standard);
        }
        .mermaid-shell:hover .zoom-controls,
        .zoom-controls:focus-within { opacity: 1; }
        .zoom-controls button {
            width: 28px; height: 28px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface-warm);
            cursor: pointer; font-size: var(--text-sm);
            display: flex; align-items: center; justify-content: center;
            color: var(--fg-2);
            transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
        }
        .zoom-controls button:hover { color: var(--accent); border-color: var(--accent); }
        .zoom-controls button:active { opacity: .85; }
        .mermaid-viewport {
            overflow: hidden; cursor: grab;
            min-height: 100px; padding: var(--space-6);
        }
        .mermaid-viewport:active { cursor: grabbing; }
        .mermaid-viewport .mermaid {
            text-align: center;
            transform-origin: 0 0;
            transition: transform var(--motion-fast) var(--ease-standard);
        }
        /* Fill the frame width so SVG and shell always scale together.
           `width: 100%` overrides mermaid's inline `max-width: <px>` cap;
           `height: auto` keeps the viewBox aspect ratio. */
        .mermaid svg {
            width: 100% !important;
            height: auto !important;
            max-width: 100% !important;
        }

        /* -- Mermaid edge styling --
           The marching-ants animation this class used to carry ran forever on
           every edge; on a 56-edge diagram it cost ~25% of frames in Gecko
           (506 -> 639 frames per 4s, measured 3/3). Static dashes now, and the
           design system bans decorative looping motion, so it stays static. */
        .mermaid svg .viz-flow { stroke-dasharray: 6 4 !important; }
        .mermaid svg .viz-flow-dashed { stroke-dasharray: 3 4 !important; }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: var(--space-2) 0;
        }

        /* -- TOC navigation -- */
        body.has-toc { max-width: none; margin: 0; padding: 0; }
        .doc-layout {
            display: flex;
            max-width: calc(var(--measure) + 2 * var(--container-gutter-desktop));
            margin: var(--space-12) auto; padding: 0 var(--container-gutter-desktop);
        }
        .toc {
            display: none; position: sticky; top: var(--space-8);
            max-height: calc(100vh - var(--space-12) * 2); overflow-y: auto;
            font-size: var(--text-sm); padding-right: var(--space-5);
            border-right: 1px solid var(--border);
        }
        .toc a {
            display: block; padding: var(--space-1) var(--space-3);
            color: var(--muted); text-decoration: none;
            border-left: 2px solid transparent; border-bottom: none;
            transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
            line-height: 1.4;
        }
        .toc a:hover { color: var(--fg); }
        .toc a.active { color: var(--accent); border-left-color: var(--accent); }
        .toc a.toc-h3 { padding-left: var(--space-6); color: var(--meta); }
        .toc a.toc-h3:hover { color: var(--fg-2); }
        /* The TOC is additive: it claims its own 220px rail so the prose column
           keeps the same measure it has without a TOC. */
        @media (min-width: 1200px) {
            .doc-layout {
                max-width: min(var(--container-max), calc(var(--measure) + 220px + var(--space-12) + 2 * var(--container-gutter-desktop)));
                gap: var(--space-12);
            }
            .toc { display: block; width: 220px; min-width: 220px; }
            .doc-layout #content { min-width: 0; flex: 1; }
        }
        .toc-mobile {
            display: none; overflow-x: auto; padding: var(--space-2) 0;
            margin-bottom: var(--space-4); border-bottom: 1px solid var(--border);
            -webkit-overflow-scrolling: touch;
            position: sticky; top: 0; z-index: 20;
            background: var(--bg);
        }
        .toc-mobile a {
            white-space: nowrap; padding: var(--space-1) var(--space-3);
            color: var(--muted); text-decoration: none; font-size: var(--text-sm);
            border-bottom: 2px solid transparent;
        }
        .toc-mobile a.active { color: var(--accent); border-bottom-color: var(--accent); }
        @media (max-width: 1199px) {
            .toc-mobile.has-items { display: flex; }
        }

        /* -- Collapsible code blocks -- */
        details.code-collapse { margin: var(--space-5) 0; }
        details.code-collapse summary {
            cursor: pointer; padding: var(--space-2) var(--space-4);
            background: var(--surface-warm); border-radius: 0;
            color: var(--muted); font-family: var(--font-mono);
            font-size: var(--text-xs); list-style: none;
            letter-spacing: .12em; text-transform: uppercase;
            display: flex; align-items: center; gap: var(--space-2);
            border: 1px solid var(--border);
            transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
        }
        details.code-collapse summary:hover { color: var(--accent); border-color: var(--accent); }
        details.code-collapse summary::-webkit-details-marker { display: none; }
        details.code-collapse summary::before { content: '\203A'; color: var(--accent); transition: transform var(--motion-base) var(--ease-standard); }
        details.code-collapse[open] summary::before { transform: rotate(90deg); }
        details.code-collapse[open] summary { border-bottom: none; }
        details.code-collapse pre { margin-top: 0 !important; border-radius: 0 !important; }
        details.code-collapse .code-block { margin-top: 0; border-radius: 0; }
        details.code-collapse .code-block .code-header { display: none; }

        /* -- Responsive: tablet keeps the measure, only the gutter tightens -- */
        @media (max-width: 900px) {
            body { padding: 0 var(--container-gutter-tablet); }
            .doc-layout { padding: 0 var(--container-gutter-tablet); }
        }

        /* -- Mobile responsive -- */
        @media (max-width: 600px) {
            body { margin: var(--space-6) auto; padding: 0 var(--container-gutter-phone); font-size: 15px; }
            body.has-toc { padding: 0; }
            .doc-layout { margin: var(--space-6) auto; padding: 0 var(--container-gutter-phone); }
            h1 { font-size: var(--text-lg); }
            h2 { font-size: var(--text-base); }
            h3 { font-size: 15px; }
            pre { padding: var(--space-3); }
            th, td { padding: var(--space-2); }
            .mermaid-viewport { padding: var(--space-3); }
            .zoom-controls { opacity: 1; }
            .zoom-controls button { width: 32px; height: 32px; }
            details.code-collapse summary { padding: var(--space-2) var(--space-3); }
            blockquote { padding: var(--space-2) var(--space-4); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }

        /* -- Print / PDF: ink-friendly, paginated. The screen theme is dark-only,
              so paper gets no background at all rather than a light theme. -- */
        @media print {
            @page { size: A4; margin: 18mm 16mm; }
            html { background: none !important; }
            body {
                max-width: none !important; margin: 0 !important; padding: 0 !important;
                background: none !important; color: #111 !important;
                font-size: 11pt; line-height: 1.5;
            }
            h1, h2, h3, h4, h5, h6, p, li, td, th, blockquote, code, pre code, .hljs {
                color: #111 !important; background: none !important;
            }
            #content > h2::before { color: #111 !important; }
            a { color: #111 !important; border-bottom: none !important; }

            /* TOC navigation is useless on paper */
            .toc, .toc-mobile { display: none !important; }
            .doc-layout { display: block !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
            .doc-layout #content { min-width: 0; }

            /* Expand collapsed long code blocks so nothing is lost */
            details.code-collapse > summary { display: none !important; }
            details.code-collapse:not([open]) > *:not(summary) { display: block !important; }

            /* Keep atomic blocks from splitting across pages */
            pre, .code-block, .table-wrap, table, blockquote, figure,
            .mermaid-shell, .katex-display, img { break-inside: avoid; page-break-inside: avoid; }
            h1, h2, h3, h4 { break-after: avoid; page-break-after: avoid; }
            p, li, blockquote { widows: 3; orphans: 3; }

            pre, .code-block, .table-wrap, .mermaid-shell, th, td { border-color: #999 !important; }
            .code-header { background: none !important; color: #555 !important; }
            .zoom-controls { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- DOMPurify: sanitizes ALL rendered HTML before DOM insertion to prevent XSS -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

    <!-- Diagrams: ESM build so the ELK layout engine can be registered.
         ELK is opt-in per diagram via `%%{init: {"layout": "elk"}}%%`. -->
    <script type="module">
        window.__mermaidReady = (async function() {
            var m = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
            window.mermaid = m.default;
            try {
                var elk = await import('https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs');
                window.mermaid.registerLayoutLoaders(elk.default);
            } catch (e) {
                // ponytail: ELK is an enhancement — dagre still renders without it
                console.warn('viz: ELK layout unavailable, falling back to dagre', e);
            }
            // Brand icons for `architecture-beta`. Lazy: the loader only fires
            // if a diagram actually references a `logos:` icon.
            window.mermaid.registerIconPacks([{
                name: 'logos',
                loader: function() {
                    return fetch('https://cdn.jsdelivr.net/npm/@iconify-json/logos@1/icons.json').then(function(r) { return r.json(); });
                }
            }]);
        })();
    </script>

    <!-- Code highlighting -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@latest/build/highlight.min.js"></script>

    <!-- KaTeX math -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.33/dist/katex.min.js"></script>

    <script>
        function base64DecodeUTF8(base64) {
            var binaryString = atob(base64);
            var bytes = new Uint8Array(binaryString.length);
            for (var i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        window.addEventListener('load', function() {
            try {
                // 1. Decode base64 content
                var docBase64 = "DOC_BASE64_PLACEHOLDER";
                var docMarkdown = base64DecodeUTF8(docBase64);

                // 2. Configure marked with highlight.js for syntax highlighting
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    gfm: true,
                    breaks: false
                });

                // 3. Render markdown to HTML, sanitize with DOMPurify to prevent XSS,
                //    then insert the sanitized result into the DOM
                var html = marked.parse(docMarkdown);
                var cleanHtml = DOMPurify.sanitize(html, {
                    ADD_TAGS: ['pre', 'span'],
                    ADD_ATTR: ['class', 'language', 'style']
                });
                document.getElementById('content').innerHTML = cleanHtml;

                // 4. KaTeX: render math expressions after DOM insertion
                // Block math: $$...$$
                document.querySelectorAll('p, li, td, th, blockquote').forEach(function(el) {
                    if (el.textContent.indexOf('$$') === -1) return;
                    el.innerHTML = el.innerHTML.replace(/\$\$([\s\S]*?)\$\$/g, function(match, tex) {
                        try {
                            return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false });
                        } catch (e) { return match; }
                    });
                });
                // Inline math: $...$ (but not $$)
                document.querySelectorAll('p, li, td, th, blockquote').forEach(function(el) {
                    if (el.textContent.indexOf('$') === -1) return;
                    el.innerHTML = el.innerHTML.replace(/(?<!\$)\$(?!\$)((?:[^$\\]|\\.)+?)\$(?!\$)/g, function(match, tex) {
                        try {
                            return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false });
                        } catch (e) { return match; }
                    });
                });

                // 5. Wrap code blocks with language header and copy button
                document.querySelectorAll('#content pre').forEach(function(pre) {
                    if (pre.closest('.mermaid-shell')) return;
                    if (pre.parentElement.classList.contains('code-block')) return;
                    var code = pre.querySelector('code');
                    var lang = '';
                    if (code) {
                        var m = code.className.match(/language-(\w+)/);
                        if (m) lang = m[1];
                    }
                    if (lang && lang !== 'mermaid') {
                        var wrapper = document.createElement('div');
                        wrapper.className = 'code-block';
                        var header = document.createElement('div');
                        header.className = 'code-header';
                        var langSpan = document.createElement('span');
                        langSpan.textContent = '[ ' + lang + ' ]';
                        header.appendChild(langSpan);
                        var copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.textContent = 'copy';
                        copyBtn.addEventListener('click', function() {
                            var text = code ? code.textContent : pre.textContent;
                            navigator.clipboard.writeText(text).then(function() {
                                copyBtn.textContent = 'copied';
                                setTimeout(function() { copyBtn.textContent = 'copy'; }, 1500);
                            });
                        });
                        header.appendChild(copyBtn);
                        wrapper.appendChild(header);
                        pre.parentNode.insertBefore(wrapper, pre);
                        wrapper.appendChild(pre);
                    }
                });

                // 6. Helper: create zoom control buttons
                function createZoomControls() {
                    var controls = document.createElement('div');
                    controls.className = 'zoom-controls';
                    var actions = [
                        { action: 'zoom-in', title: 'Zoom in', label: '+' },
                        { action: 'zoom-out', title: 'Zoom out', label: '\u2212' },
                        { action: 'zoom-reset', title: 'Reset', label: '1:1' },
                        { action: 'expand', title: 'Open in new tab', label: '\u2197' }
                    ];
                    actions.forEach(function(item) {
                        var btn = document.createElement('button');
                        btn.dataset.action = item.action;
                        btn.title = item.title;
                        btn.textContent = item.label;
                        controls.appendChild(btn);
                    });
                    return controls;
                }

                // 7. Convert mermaid code blocks to shells with zoom/pan
                document.querySelectorAll('code.language-mermaid').forEach(function(codeBlock) {
                    var pre = codeBlock.parentElement;
                    var wrapper = pre.closest('.code-block');
                    var shell = document.createElement('div');
                    shell.className = 'mermaid-shell';
                    shell.appendChild(createZoomControls());
                    var viewport = document.createElement('div');
                    viewport.className = 'mermaid-viewport';
                    var mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = codeBlock.textContent;
                    mermaidDiv.dataset.src = codeBlock.textContent;
                    viewport.appendChild(mermaidDiv);
                    shell.appendChild(viewport);
                    if (wrapper) {
                        wrapper.replaceWith(shell);
                    } else {
                        pre.replaceWith(shell);
                    }
                });

                // 8. Wrap tables in scrollable containers
                document.querySelectorAll('#content table').forEach(function(table) {
                    if (table.parentElement.classList.contains('table-wrap')) return;
                    var wrap = document.createElement('div');
                    wrap.className = 'table-wrap';
                    table.parentNode.insertBefore(wrap, table);
                    wrap.appendChild(table);
                });

                // 9. Collapse long code blocks (30+ lines)
                document.querySelectorAll('#content pre').forEach(function(pre) {
                    if (pre.closest('.mermaid-shell')) return;
                    var lines = pre.textContent.split('\n').length;
                    if (lines < 30) return;
                    var codeBlockWrapper = pre.closest('.code-block');
                    var target = codeBlockWrapper || pre;
                    var details = document.createElement('details');
                    details.className = 'code-collapse';
                    var summary = document.createElement('summary');
                    var lang = '';
                    var code = pre.querySelector('code');
                    if (code) {
                        var m = code.className.match(/language-(\w+)/);
                        if (m) lang = m[1];
                    }
                    summary.textContent = lang ? '[ ' + lang + ' ] \u00B7 ' + lines + ' lines' : lines + ' lines';
                    details.appendChild(summary);
                    target.parentNode.insertBefore(details, target);
                    details.appendChild(target);
                });

                // 10. Generate TOC from headings (4+ sections)
                var headings = document.querySelectorAll('#content h2, #content h3');
                if (headings.length >= 4) {
                    var toc = document.createElement('nav');
                    toc.className = 'toc';
                    var tocMobile = document.createElement('nav');
                    tocMobile.className = 'toc-mobile has-items';
                    headings.forEach(function(h, i) {
                        if (!h.id) h.id = 'heading-' + i;
                        var a = document.createElement('a');
                        a.href = '#' + h.id;
                        a.textContent = h.textContent;
                        if (h.tagName === 'H3') a.className = 'toc-h3';
                        toc.appendChild(a);
                        if (h.tagName === 'H2') tocMobile.appendChild(a.cloneNode(true));
                    });
                    var content = document.getElementById('content');
                    var layout = document.createElement('div');
                    layout.className = 'doc-layout';
                    content.parentNode.insertBefore(layout, content);
                    layout.appendChild(toc);
                    layout.appendChild(content);
                    content.insertBefore(tocMobile, content.firstChild);
                    document.body.classList.add('has-toc');
                    var tocLinks = toc.querySelectorAll('a');
                    var mobileLinks = tocMobile.querySelectorAll('a');
                    var observer = new IntersectionObserver(function(entries) {
                        entries.forEach(function(entry) {
                            if (entry.isIntersecting) {
                                tocLinks.forEach(function(l) { l.classList.remove('active'); });
                                mobileLinks.forEach(function(l) { l.classList.remove('active'); });
                                var id = entry.target.id;
                                var hit = toc.querySelector('a[href="#' + id + '"]');
                                if (hit) hit.classList.add('active');
                                var hitM = tocMobile.querySelector('a[href="#' + id + '"]');
                                if (hitM) hitM.classList.add('active');
                            }
                        });
                    }, { rootMargin: '-10% 0px -80% 0px' });
                    headings.forEach(function(h) { observer.observe(h); });
                }

                // 11. Initialize Mermaid (visibility-aware lazy rendering).
                //     Diagram colors are the musingfox tokens; `printing` swaps to
                //     an ink-friendly palette because the screen theme is dark-only.
                function mermaidThemeConfig(printing) {
                    if (printing) return { startOnLoad: false, theme: 'neutral', securityLevel: 'strict' };
                    return {
                        startOnLoad: false, theme: 'base', securityLevel: 'strict',
                        themeVariables: {
                            darkMode: true, background: 'transparent',
                            fontFamily: 'Fira Code, jf Open Huninn, PingFang TC, ui-monospace, monospace',
                            primaryColor: '#222222', primaryBorderColor: '#fd971f', primaryTextColor: '#e8e8e5',
                            secondaryColor: '#181818', secondaryBorderColor: '#75715e',
                            tertiaryColor: '#181818', tertiaryBorderColor: '#2e2e2e',
                            lineColor: '#75715e', nodeBorder: '#fd971f',
                            clusterBkg: '#181818', clusterBorder: '#2e2e2e',
                            edgeLabelBackground: '#222222', titleColor: '#fd971f'
                        }
                    };
                }
                var mermaidNodes = document.querySelectorAll('.mermaid');
                // The palette the last render was QUEUED with — not "a render
                // finished". Tying the re-theme to completion loses a print
                // request issued before the first render resolves.
                var mermaidQueuedPrinting = null;
                function tagMermaidEdges() {
                    document.querySelectorAll('.mermaid svg').forEach(function(svg) {
                        // Flowchart: paths inside any g whose class contains "edge"
                        svg.querySelectorAll('g[class*="edge"] path').forEach(function(p) {
                            // Skip arrowhead markers (they live in <defs>/<marker>, not edges)
                            if (p.closest('marker')) return;
                            p.classList.add('viz-flow');
                        });
                        // Sequence: solid messages
                        svg.querySelectorAll('.messageLine0, [class*="messageLine0"]').forEach(function(l) {
                            l.classList.add('viz-flow');
                        });
                        // Sequence: dashed reply messages
                        svg.querySelectorAll('.messageLine1, [class*="messageLine1"]').forEach(function(l) {
                            l.classList.add('viz-flow-dashed');
                        });
                    });
                }
                // Renders are serialized: a print re-theme fired while the first
                // render is still in flight would otherwise let the stale (screen
                // palette) run finish last and overwrite the new one.
                var mermaidQueue = Promise.resolve();
                function renderMermaid(printing) {
                    if (mermaidNodes.length === 0) return;
                    mermaidQueuedPrinting = !!printing;
                    mermaidQueue = mermaidQueue
                        .catch(function() {})
                        // mermaid loads as a deferred ES module — wait for it before rendering
                        .then(function() { return window.__mermaidReady; })
                        .then(function() {
                            mermaid.initialize(mermaidThemeConfig(printing));
                            // Reset each node so a re-render (e.g. theme toggle) re-runs cleanly
                            mermaidNodes.forEach(function(n) {
                                n.removeAttribute('data-processed');
                                if (n.dataset.src != null) n.textContent = n.dataset.src;
                            });
                            return new Promise(function(r) { requestAnimationFrame(r); });
                        })
                        .then(function() { return mermaid.run({ nodes: mermaidNodes }); })
                        .then(tagMermaidEdges);
                }
                if (document.visibilityState === 'visible') {
                    renderMermaid();
                } else {
                    document.addEventListener('visibilitychange', function onVisible() {
                        if (document.visibilityState === 'visible') {
                            document.removeEventListener('visibilitychange', onVisible);
                            renderMermaid();
                        }
                    });
                }

                // 12. Mermaid zoom/pan controls
                function openDiagramTab(svgEl) {
                    var page = document.implementation.createHTMLDocument('Diagram');
                    // The SVG carries this page's mermaid palette, so the standalone
                    // tab has to sit on the same binding canvas to stay readable.
                    var bg = '#07080a';
                    page.body.setAttribute('style', 'margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:' + bg);
                    var style = page.createElement('style');
                    style.textContent = 'svg{max-width:95vw;max-height:95vh}';
                    page.head.appendChild(style);
                    page.body.appendChild(page.importNode(svgEl, true));
                    var blob = new Blob([page.documentElement.outerHTML], { type: 'text/html' });
                    window.open(URL.createObjectURL(blob), '_blank');
                }
                document.querySelectorAll('.mermaid-shell').forEach(function(shell) {
                    var viewport = shell.querySelector('.mermaid-viewport');
                    var canvas = viewport.querySelector('.mermaid') || viewport.querySelector('.mermaid-rendered');
                    if (!canvas) return;
                    var scale = 1, panX = 0, panY = 0, startX, startY;
                    function apply() {
                        canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
                    }
                    shell.querySelectorAll('.zoom-controls button').forEach(function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var act = btn.dataset.action;
                            if (act === 'zoom-in') scale = Math.min(scale * 1.3, 5);
                            else if (act === 'zoom-out') scale = Math.max(scale / 1.3, 0.2);
                            else if (act === 'zoom-reset') { scale = 1; panX = 0; panY = 0; }
                            else if (act === 'expand') {
                                var svg = canvas.querySelector('svg');
                                if (svg) openDiagramTab(svg);
                            }
                            apply();
                        });
                    });
                    viewport.addEventListener('wheel', function(e) {
                        if (e.ctrlKey || e.metaKey) {
                            e.preventDefault();
                            scale = Math.max(0.2, Math.min(5, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
                            apply();
                        }
                    }, { passive: false });
                    viewport.addEventListener('mousedown', function(e) {
                        if (e.button !== 0) return;
                        startX = e.clientX - panX;
                        startY = e.clientY - panY;
                        function onMove(ev) {
                            panX = ev.clientX - startX;
                            panY = ev.clientY - startY;
                            canvas.style.transition = 'none';
                            apply();
                        }
                        function onUp() {
                            canvas.style.transition = '';
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onUp);
                        }
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                    });
                    // Touch: single finger pan
                    viewport.addEventListener('touchstart', function(e) {
                        if (e.touches.length === 1) {
                            startX = e.touches[0].clientX - panX;
                            startY = e.touches[0].clientY - panY;
                        }
                    }, { passive: true });
                    viewport.addEventListener('touchmove', function(e) {
                        if (e.touches.length === 1) {
                            e.preventDefault();
                            panX = e.touches[0].clientX - startX;
                            panY = e.touches[0].clientY - startY;
                            canvas.style.transition = 'none';
                            apply();
                        } else if (e.touches.length === 2) {
                            e.preventDefault();
                            var dx = e.touches[0].clientX - e.touches[1].clientX;
                            var dy = e.touches[0].clientY - e.touches[1].clientY;
                            var dist = Math.sqrt(dx * dx + dy * dy);
                            if (viewport._lastPinchDist) {
                                var delta = dist / viewport._lastPinchDist;
                                scale = Math.max(0.2, Math.min(5, scale * delta));
                                apply();
                            }
                            viewport._lastPinchDist = dist;
                        }
                    }, { passive: false });
                    viewport.addEventListener('touchend', function() {
                        canvas.style.transition = '';
                        viewport._lastPinchDist = null;
                    }, { passive: true });
                });

                // 13. Print in an ink-friendly diagram palette, then restore.
                //     The page itself is dark-only; only mermaid needs the swap.
                window.addEventListener('beforeprint', function() {
                    if (mermaidQueuedPrinting === false) renderMermaid(true);
                });
                window.addEventListener('afterprint', function() {
                    if (mermaidQueuedPrinting === true) renderMermaid(false);
                });

            } catch (error) {
                document.getElementById('content').textContent = 'Error: ' + error.message;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
